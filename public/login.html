<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math League - Teacher Portal</title>
    <style>
        body { font-family: 'Montserrat', Arial, sans-serif; background-color: #f5f7fa; color: #2d3436; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container { background: white; border-radius: 24px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.08); text-align: center; box-sizing: border-box; }
        h2 { font-size: 2rem; color: #6c5ce7; margin-top: 0; margin-bottom: 10px; }
        p { color: #b2bec3; margin-bottom: 30px; font-size: 1rem; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #2d3436; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; border: 2px solid #dfe6e9; border-radius: 12px; font-size: 1rem; box-sizing: border-box; transition: all 0.2s ease; font-family: inherit; }
        input:focus { border-color: #6c5ce7; outline: none; background: #fbfbfe; }
        .auth-btn { width: 100%; background: #6c5ce7; color: white; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 0 #4a3baf; transition: all 0.2s ease; margin-top: 10px; }
        .auth-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a3baf; }
        .toggle-link { margin-top: 25px; color: #74b9ff; cursor: pointer; font-weight: bold; display: inline-block; text-decoration: underline; }
        .error-msg { color: #d63031; font-weight: bold; margin-top: 15px; display: none; background: #ffeaa7; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        .success-msg { color: #00b894; font-weight: bold; margin-top: 15px; display: none; background: #e8f8f5; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="authTitle">Teacher Login</h2>
        <p id="authSub">Access your dashboard & geometry game sets</p>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="coach@mathleague.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="auth-btn" id="submitBtn" onclick="handleAuthSubmit()">LOG IN 🔐</button>
        <div id="errorBox" class="error-msg"></div>
        <div id="successBox" class="success-msg"></div>

        <div class="toggle-link" id="toggleModeLink" onclick="toggleAuthMode()">Don't have an account? Sign up here</div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const sub = document.getElementById('authSub');
            const btn = document.getElementById('submitBtn');
            const toggle = document.getElementById('toggleModeLink');
            
            // Clear status messages
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('successBox').style.display = 'none';

            if (isLoginMode) {
                title.innerText = "Teacher Login";
                sub.innerText = "Access your dashboard & geometry game sets";
                btn.innerText = "LOG IN 🔐";
                toggle.innerText = "Don't have an account? Sign up here";
            } else {
                title.innerText = "Create Account";
                sub.innerText = "Register your secure teacher workspace profile";
                btn.innerText = "REGISTER ACCOUNT 🚀";
                toggle.innerText = "Already registered? Log in instead";
            }
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');

            errorBox.style.display = "none";
            successBox.style.display = "none";

            if (!email || !password) {
                errorBox.innerText = "Please fill in all fields.";
                errorBox.style.display = "block";
                return;
            }

            const targetEndpoint = isLoginMode ? '/api/auth/login' : '/api/auth/signup';

            try {
                const response = await fetch(targetEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerText = data.error || "An authentication error occurred.";
                    errorBox.style.display = "block";
                } else {
                    if (isLoginMode) {
                        successBox.innerText = "Success! Forwarding to workspace...";
                        successBox.style.display = "block";
                        setTimeout(() => {
                            window.location.href = "/creator.html";
                        }, 1000);
                    } else {
                        successBox.innerText = "Account ready! Switching to login layer...";
                        successBox.style.display = "block";
                        document.getElementById('password').value = "";
                        setTimeout(() => {
                            toggleAuthMode();
                        }, 1500);
                    }
                }
            } catch (err) {
                errorBox.innerText = "Cannot contact the server right now.";
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
