<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0c10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Numora">
    <meta charset="UTF-8">
    <title>Numora — Player Arena</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #0a0c10;
            --card-bg: rgba(22, 27, 34, 0.85);
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --accent-pink: #ff0080;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            text-align: center; 
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
            color: var(--text-main); 
            padding: 20px; 
            margin: 0; 
            min-height: 95vh; 
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #timer { 
            font-family: 'Outfit', sans-serif;
            font-size: 6rem; 
            font-weight: 800; 
            color: var(--accent-cyan); 
            margin-top: 40px; 
            margin-bottom: 30px; 
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4); 
        }
        
        .box-container { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 30px 24px; 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.5); 
            display: inline-block; 
            width: 370px; 
            color: var(--text-main); 
            text-align: center; 
            box-sizing: border-box; 
        }

        input { 
            padding: 15px; 
            font-size: 1.4rem; 
            width: 100%; 
            text-align: center; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            margin-bottom: 16px; 
            font-weight: 600; 
            color: #fff; 
            box-sizing: border-box; 
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }
        
        button { 
            padding: 16px; 
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem; 
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            box-shadow: 0 4px 15px rgba(255, 0, 128, 0.3); 
            width: 100%; 
            margin-bottom: 5px; 
            transition: all 0.2s ease;
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 128, 0.5);
        }

        button:active { 
            transform: translateY(0); 
            box-shadow: 0 2px 8px rgba(255, 0, 128, 0.4); 
        }
        
        #errorBadge { 
            color: #ff7675; 
            font-weight: bold; 
            font-size: 0.95rem; 
            margin-top: 15px; 
            display: none; 
            background: rgba(214, 48, 49, 0.15); 
            border: 1px solid rgba(214, 48, 49, 0.3);
            padding: 12px; 
            border-radius: 10px; 
        }

        .forgot-link { 
            display: block; 
            margin-top: 15px; 
            color: var(--accent-cyan); 
            font-size: 0.9rem; 
            font-weight: 600; 
            text-decoration: none; 
            cursor: pointer; 
            transition: opacity 0.2s;
        }

        .forgot-link:hover { 
            text-decoration: underline; 
            opacity: 0.8;
        }

        .preview-avatar { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3rem; 
            font-weight: bold; 
            margin: 0 auto 15px auto; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            transition: background 0.2s; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3); 
        }
        
        .selector-row-title { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            font-weight: 700; 
            color: var(--text-muted); 
            letter-spacing: 1px; 
            margin: 18px 0 8px 0; 
            text-align: left; 
            padding-left: 2px; 
        }
        
        .emoji-scroll-container { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            max-height: 220px; 
            overflow-y: auto; 
            padding: 10px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            background: rgba(0, 0, 0, 0.2); 
        }
        
        .symbol-opt { 
            font-size: 1.6rem; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            cursor: pointer; 
            padding: 4px 0; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            aspect-ratio: 1 / 1; 
            box-sizing: border-box; 
        }

        .symbol-opt:hover { 
            background: rgba(255, 255, 255, 0.15); 
        }

        .symbol-opt.selected { 
            background: rgba(255, 255, 255, 0.25); 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }
        
        .color-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 10px; 
        }

        .color-opt { 
            height: 40px; 
            border-radius: 10px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: transform 0.15s ease; 
        }

        .color-opt:hover { 
            transform: scale(1.1); 
        }

        .color-opt.selected { 
            border-color: #ffffff; 
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }
        
        .symbol-opt.taken { 
            opacity: 0.2; 
            cursor: not-allowed; 
            pointer-events: none; 
            border: 2px dashed #ff7675 !important; 
            background: transparent; 
        }

        #loginForm { margin-top: 50px; }
        #avatarForm, #gameArea { display: none; }
        #waitingArea { 
            font-family: 'Outfit', sans-serif;
            font-size: 2rem; 
            font-weight: 700; 
            margin-top: 120px; 
        }
    </style>
</head>
<body>

    <div id="loginForm">
        <h2 style="font-size: 2.5rem; margin-bottom: 20px;">Enter the Arena 🎮</h2>
        <div class="box-container">
            <input type="text" id="nameInput" placeholder="Your Name" required><br>
            <input type="text" id="codeInput" placeholder="8-Digit Code" required><br>
            <button id="joinBtn">CONNECT</button>
            <a class="forgot-link" id="forgotBtn">Forgot your code/password?</a>
            <div id="errorBadge"></div>
        </div>
    </div>

    <div id="avatarForm">
        <h2 style="font-size: 2.2rem; margin-bottom: 15px;">Choose Your Avatar</h2>
        <div class="box-container">
            <div class="preview-avatar" id="avatarPreviewCircle">🔥</div>
            
            <div class="selector-row-title">Pick an Emoji</div>
            <div class="emoji-scroll-container" id="symbolGridContainer"></div>

            <div class="selector-row-title">Pick a Background Color</div>
            <div class="color-grid" id="colorGridContainer"></div>
            
            <p style="font-size:0.85rem; color: var(--text-muted); margin-top:16px; font-weight:500;">Emojis are first-come, first-served!</p>
        </div>
    </div>

    <div id="waitingArea">
        <p>Awaiting host to start... 📡</p>
    </div>

    <div id="gameArea">
        <div id="timer">3:00</div>
        <div class="box-container">
            <input type="text" id="answerInput" placeholder="Your Answer..."><br>
            <button id="submitBtn" onclick="submitAnswerToServer()">SUBMIT</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let countdownInterval = null;
        let myId = null;

        const availableEmojis = [
            "🔥","👑","🚀","👾","🍕","🐱","🦊","🫅","🎭","🎲","🎯","🧩","🎪","🎨","💎","⚡","🌈","🍀","🌍",
            "🐼","🐨","🐯","🦁","🐸","🐵","🦄","🦅","🦉","🦖","🐙","🦈","🍦","🍿","🍩","🍪","🥑","🌮","🎮","🎸",
            "🏆","⚽","🏀","🎬","✈️","🛸","⚓️","🏝️","🌋","🔮","🎈","🎉","🎁","💡","🔑","📦","🍎","🥕","🍿","🧠"
        ];
        const availableColors = ["#0984e3","#6c5ce7","#00b894","#d63031","#e84393","#e17055"];

        let currentChosenSymbol = "";
        let currentChosenColor = "";

        document.getElementById('waitingArea').style.display = 'none';

        // Keyboard Event Handlers
        document.getElementById('nameInput').addEventListener('keydown', handleLoginKeydown);
        document.getElementById('codeInput').addEventListener('keydown', handleLoginKeydown);
        document.getElementById('answerInput').addEventListener('keydown', handleAnswerKeydown);

        function handleLoginKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                processRoomJoin();
            }
        }

        function handleAnswerKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (!document.getElementById('answerInput').disabled) {
                    submitAnswerToServer();
                }
            }
        }

        // Forgot Password/Code Trigger
        document.getElementById('forgotBtn').addEventListener('click', function() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert("Please type your name first so the host knows who is asking!");
                return;
            }
            // Emits an event to the server to handle the recovery
            socket.emit('requestPasswordRecovery', { name });
            alert("Sent a help request to the host screen! Hang tight.");
        });

        function buildAvatarCustomizerUI() {
            const symContainer = document.getElementById('symbolGridContainer');
            symContainer.innerHTML = "";
            availableEmojis.forEach(sym => {
                const item = document.createElement('div');
                item.className = 'symbol-opt';
                item.innerText = sym;
                item.id = `sym-opt-${sym}`;
                item.onclick = () => selectSymbol(sym);
                symContainer.appendChild(item);
            });

            const colContainer = document.getElementById('colorGridContainer');
            colContainer.innerHTML = "";
            availableColors.forEach(col => {
                const item = document.createElement('div');
                item.className = 'color-opt';
                item.style.background = col;
                item.id = `col-opt-${col}`;
                item.onclick = () => selectColor(col);
                colContainer.appendChild(item);
            });
            updateSelectionHighlights();
        }

        function processRoomJoin() {
            const name = document.getElementById('nameInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            if(!name || !code) return alert("Fill out your name and room code!");
            document.getElementById('errorBadge').style.display = 'none';
            socket.emit('joinRoom', { name, code });
        }

        document.getElementById('joinBtn').addEventListener('click', processRoomJoin);

        socket.on('joinSuccess', (data) => {
            myId = data.id;
            currentChosenSymbol = data.defaultSymbol;
            currentChosenColor = data.defaultColor;

            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('avatarForm').style.display = 'block';
            
            buildAvatarCustomizerUI();
            sendAvatarUpdate();
        });

        socket.on('joinError', (msg) => {
            const badge = document.getElementById('errorBadge');
            badge.innerText = msg;
            badge.style.display = 'block';
        });

        function selectSymbol(sym) {
            currentChosenSymbol = sym;
            sendAvatarUpdate();
        }

        function selectColor(col) {
            currentChosenColor = col;
            sendAvatarUpdate();
        }

        function sendAvatarUpdate() {
            document.getElementById('avatarPreviewCircle').innerText = currentChosenSymbol;
            document.getElementById('avatarPreviewCircle').style.background = currentChosenColor;
            updateSelectionHighlights();
            socket.emit('updateAvatar', { symbol: currentChosenSymbol, color: currentChosenColor });
        }

        socket.on('syncTakenAvatars', (roster) => {
            document.querySelectorAll('.symbol-opt').forEach(el => el.classList.remove('taken'));

            roster.forEach(player => {
                if (player.id === myId) return;
                const takenElement = document.getElementById(`sym-opt-${player.avatarSymbol}`);
                if (takenElement) {
                    takenElement.classList.add('taken');
                }
            });
        });

        socket.on('avatarSelectionFailed', (data) => {
            alert(data.message);
            currentChosenSymbol = data.fallbackSymbol;
            sendAvatarUpdate();
        });

        function updateSelectionHighlights() {
            document.querySelectorAll('.symbol-opt').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('selected'));
            
            const targetSym = document.getElementById(`sym-opt-${currentChosenSymbol}`);
            if(targetSym) targetSym.classList.add('selected');
            
            const targetCol = document.getElementById(`col-opt-${currentChosenColor}`);
            if(targetCol) targetCol.classList.add('selected');
        }

        socket.on('lockAndLoadMatch', () => {
            document.getElementById('avatarForm').style.display = 'none';
            document.getElementById('waitingArea').style.display = 'block';
            document.getElementById('waitingArea').innerHTML = "<p>Match starting... Get ready! 🏁</p>";
        });

        socket.on('revealQuestionInput', (data) => {
            document.getElementById('waitingArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            
            const inputField = document.getElementById('answerInput');
            const submitButton = document.getElementById('submitBtn');
            
            inputField.disabled = false;
            submitButton.disabled = false;
            inputField.value = '';
            inputField.focus();
            
            // Use target endTime passed from server/host or calculate fallback
            const endTime = (data && data.endTime) ? data.endTime : Date.now() + (180 * 1000);
            startTimerByEndTime(endTime); 
        });

        function startTimerByEndTime(endTime) {
            if (countdownInterval) clearInterval(countdownInterval);
            const display = document.getElementById('timer');

            function updateDisplay() {
                const totalSecondsLeft = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
                
                let minutes = Math.floor(totalSecondsLeft / 60);
                let seconds = totalSecondsLeft % 60;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                
                display.textContent = minutes + ":" + seconds;

                if (totalSecondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    display.textContent = "0:00";
                    submitAnswerToServer(); 
                    socket.emit('timerExpired');
                }
            }

            updateDisplay();
            countdownInterval = setInterval(updateDisplay, 500);
        }

        function submitAnswerToServer() {
            if (countdownInterval) clearInterval(countdownInterval);
            const ans = document.getElementById('answerInput').value;
            socket.emit('submitAnswer', ans);
            
            document.getElementById('answerInput').disabled = true;
            document.getElementById('submitBtn').disabled = true;
            
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('waitingArea').style.display = 'block';
            document.getElementById('waitingArea').innerHTML = "<p style='color: white;'>Answer locked in! Look at the board! 🔒</p>";
        }

        socket.on('stopStudentTimerNow', () => {
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('waitingArea').style.display = 'block';
            document.getElementById('waitingArea').innerHTML = "<p style='color: white;'>Question closed by host! 📋</p>";
        });
    </script>
</body>
</html>
